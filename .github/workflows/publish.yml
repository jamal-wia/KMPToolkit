name: Publish to Maven Central

on:
  release:
    types: [created]

concurrency:
  group: maven-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Root-level task names (no module prefix) so this step never needs editing as
      # kmptoolkit-* modules are added — Gradle runs the task in every subproject that has it.
      - name: Check public API surface
        run: ./gradlew checkKotlinAbi --no-configuration-cache

      - name: Verify build (Android + iOS unit tests)
        run: ./gradlew testDebugUnitTest iosSimulatorArm64Test --no-configuration-cache

      # Publish locally first and build :sample against those coordinates through the BOM. A unit
      # test cannot see a malformed POM, a missing Android variant, or a publication that drops a
      # transitive dependency — a real consumer resolving the real artifacts can. Cheap, and it
      # runs before anything is pushed to Central where a bad release cannot be withdrawn.
      - name: Smoke-test the publication with a real consumer
        run: |
          ./gradlew publishToMavenLocal --no-configuration-cache
          ./gradlew :sample:assembleDebug -PuseMavenLocal --no-configuration-cache

      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
