# Robolectric 4.17 ships SDK 36 and 37 images, but running them needs
# --add-exports=java.base/jdk.internal.access=ALL-UNNAMED on the test JVM, which this build does not
# pass. Pin the newest level that runs without it. The runtime rules take their SDK level as a
# constructor parameter of AndroidPermissionController, so every API-level boundary — API 36 and 37
# included — is tested on this one image; the special accesses and roles, which call the platform
# directly, pin lower levels with @Config(sdk = ...).
sdk=35
