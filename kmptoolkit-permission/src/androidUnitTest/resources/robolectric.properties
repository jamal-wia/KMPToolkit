# Robolectric 4.16 ships no image for the repository's compileSdk (37), and defaults to it, so it
# refuses to pick an SDK at all. Pin the newest level it does support. Nothing here depends on the
# emulated level: the one API-level-dependent branch in AndroidPermissionHandler takes its SDK
# level as a constructor parameter precisely so it can be tested on both sides of API 33 without
# a second Robolectric image.
sdk=35
