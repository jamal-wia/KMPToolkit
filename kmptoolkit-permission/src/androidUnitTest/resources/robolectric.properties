# Robolectric 4.17 ships SDK 36 and 37 images, but running them needs
# --add-exports=java.base/jdk.internal.access=ALL-UNNAMED on the test JVM, which this build does not
# pass. Pin the newest level that runs without it. Nothing here depends on the
# emulated level: the one API-level-dependent branch in AndroidPermissionHandler takes its SDK
# level as a constructor parameter precisely so it can be tested on both sides of API 33 without
# a second Robolectric image.
sdk=35
