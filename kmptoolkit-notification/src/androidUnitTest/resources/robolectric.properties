# Robolectric 4.17 ships SDK 36 and 37 images, but running them needs
# --add-exports=java.base/jdk.internal.access=ALL-UNNAMED on the test JVM, which this build does not
# pass. Pin the newest level that runs without it. Module-wide rather than a
# per-class @Config, so a test added later — the manifest assertion is the easy one to forget —
# cannot miss it.
sdk=35
