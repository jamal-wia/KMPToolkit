# Robolectric 4.16 ships no image for the repository's compileSdk (37) and defaults to it, so it
# refuses to pick an SDK at all. Pin the newest level it does support. Module-wide rather than a
# per-class @Config so it also covers tests nobody remembered to annotate — LibraryManifestTest in
# particular, which is the one test whose silent absence would be worst.
sdk=35
