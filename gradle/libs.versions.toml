[versions]
# --- Toolchain ---
agp = "9.2.1"
kotlin = "2.4.10"
composeMultiplatform = "1.11.1"
mavenPublish = "0.37.0"

# --- SDK levels — single source of truth, read via libs.versions.compileSdk / .minSdk ---
compileSdk = "37"
minSdk = "24"

# --- Kotlinx ---
coroutines = "1.11.0"
datetime = "0.8.0"
serialization = "1.11.0"
atomicfu = "0.33.0"

# --- AndroidX (consumed by kmptoolkit-platform, -permission, -notification, -biometric, -uploader, sample) ---
coreKtx = "1.19.0"
androidxMedia = "1.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
biometric = "1.2.0-alpha05"
workRuntime = "2.11.2"

# --- Persistence (kmptoolkit-uploader-sqldelight) ---
sqldelight = "2.3.2"

# --- Persistence (kmptoolkit-downloader, iOS-only integrity checks over SQLite-backed units) ---
androidxSqlite = "2.7.0"

# --- Demo module only (classic Jetpack Compose, not Compose Multiplatform) ---
composeBom = "2026.02.01"

# --- Test tooling ---
junit = "4.13.2"
androidxTestExtJunit = "1.3.0"
espressoCore = "3.7.0"
robolectric = "4.16.1"

# Video: Media3 (Android engine of kmptoolkit-video-player), VLCJ (GPL-3, desktop engine in
# kmptoolkit-video-player-vlcj only), OpenJFX (GPL-2 + Classpath Exception, desktop engine in
# kmptoolkit-video-player-javafx only, compileOnly — the app supplies the runtime). 21 is the LTS
# line: it runs on JDK 17+, the widest range any maintained OpenJFX release supports.
media3 = "1.11.1"
vlcj = "4.12.1"
openjfx = "21.0.12"

[libraries]
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
# Test-only: TestExoPlayerBuilder, FakeMediaSource and the Robolectric run helpers, for
# kmptoolkit-video-player's androidUnitTest. Never a dependency of a published source set.
androidx-media3-test-utils = { group = "androidx.media3", name = "media3-test-utils", version.ref = "media3" }
androidx-media3-test-utils-robolectric = { group = "androidx.media3", name = "media3-test-utils-robolectric", version.ref = "media3" }
vlcj = { group = "uk.co.caprica", name = "vlcj", version.ref = "vlcj" }
openjfx-base = { group = "org.openjfx", name = "javafx-base", version.ref = "openjfx" }
openjfx-graphics = { group = "org.openjfx", name = "javafx-graphics", version.ref = "openjfx" }
openjfx-media = { group = "org.openjfx", name = "javafx-media", version.ref = "openjfx" }
# Kotlinx
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-atomicfu = { group = "org.jetbrains.kotlinx", name = "atomicfu", version.ref = "atomicfu" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "datetime" }

# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-media = { group = "androidx.media", name = "media", version.ref = "androidxMedia" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
# Multiplatform artifact (Android + iOS, published by Google since lifecycle 2.8) — used by
# kmptoolkit-systembars' AutoSystemBarsIconStyle to pause sampling while the host is backgrounded.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntime" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "workRuntime" }

# Persistence
sqldelight-runtime = { group = "app.cash.sqldelight", name = "runtime", version.ref = "sqldelight" }
sqldelight-coroutines-extensions = { group = "app.cash.sqldelight", name = "coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { group = "app.cash.sqldelight", name = "android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { group = "app.cash.sqldelight", name = "native-driver", version.ref = "sqldelight" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "androidxSqlite" }

# Demo module — classic Jetpack Compose BOM
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Test tooling
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

# Gradle-plugin coordinates — consumed only by build-logic, never by a library module directly
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-serialization", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.compose", name = "compose-gradle-plugin", version.ref = "composeMultiplatform" }
composeCompiler-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
mavenPublish-gradlePlugin = { group = "com.vanniktech", name = "gradle-maven-publish-plugin", version.ref = "mavenPublish" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
