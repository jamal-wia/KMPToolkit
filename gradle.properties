# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx8g
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# Single source of truth for the published artifact coordinates.
# Bumping kmptoolkit.version here updates every kmptoolkit-* module AND the kmptoolkit-bom
# constraints, so the suite cannot drift — see build-logic's PublishConventionPlugin.kt.
kmptoolkit.group=io.github.jamal-wia
kmptoolkit.version=4.0.0

# Windows build machines only, optional: a short folder for the test JVMs' java.io.tmpdir, so native
# SQLite under Robolectric stays under Windows' 259-character path limit. Off unless set; give it on the
# command line (-Pkmptoolkit.windowsTestTmpDir=C:\kt) or in ~/.gradle/gradle.properties. See build-logic's
# WindowsTestTmpDir.kt.
# kmptoolkit.windowsTestTmpDir=C:\\kt

# Maven Central publishing credentials (set in ~/.gradle/gradle.properties, NOT here):
# mavenCentralUsername=<your-sonatype-token-username>
# mavenCentralPassword=<your-sonatype-token-password>
# signing.keyId=<last-8-chars-of-gpg-key>
# signing.password=<gpg-key-passphrase>
# signing.secretKeyRingFile=<path-to-secring.gpg>

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
