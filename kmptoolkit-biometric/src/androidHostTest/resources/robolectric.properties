# Robolectric 4.17 ships SDK 36 and 37 images, but running them needs
# --add-exports=java.base/jdk.internal.access=ALL-UNNAMED on the test JVM, which this build does not
# pass. Pin the newest level that runs without it; the two cases that are
# API-level dependent — the device-credential authenticator combination — override this per test.
sdk=35
